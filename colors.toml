# Bright Future — dark-space dual-accent duotone.
# One hot magenta signal (#ff4fd1), one electric cyan depth (#45e5ff), an
# indigo-glass ground. The ground is a colour, not a void — the void shades
# sit underneath it (gaps, wallpaper), so windows read as lit panes above the
# scene. Text warms as it brightens, as if the magenta were doing the lighting:
# dim #6b74a8 (cool) -> body #d9cfe8 -> bright #fbf0fb (signal-warmed white).
# Roles and ratios: PALETTE.md.
mode = "dark"

accent    = "#ff4fd1"   # Signal (accent A) — the active colour
selection = "#221f4e"   # Material raise
muted     = "#414780"   # Material line / muted mid

background         = "#131637"   # Ground — indigo glass (L* ~9, chroma you can feel)
dark_background    = "#0b0c19"
darker_background  = "#04040b"   # void — gaps and wallpaper live down here
lighter_background = "#1e2350"

foreground        = "#d9cfe8"   # lavender-warm body text — advances off the cool glass
dark_foreground   = "#6b74a8"   # dim stays cool: distance is cold, proximity is warm
light_foreground  = "#e6dcf0"
bright_foreground = "#fbf0fb"   # pink-white — the same sun as the wallpapers' core

# Functional colours sit a step quieter than the accents: only the magenta
# signal and the cyan depth are allowed to look electrically impossible.
red     = "#ef637e"
yellow  = "#e8c77a"
orange  = "#e99a70"
green   = "#55cfa2"
cyan    = "#38d2f5"   # Depth (accent B) family
blue    = "#738ee8"
magenta = "#ff4fd1"   # = accent A
brown   = "#7d4b66"   # muted mauve — dust / dormant, not literal brown

bright_red     = "#ff8aa4"
bright_yellow  = "#f6dda2"
bright_green   = "#7ae3bd"
bright_cyan    = "#7deeff"
bright_blue    = "#9badf5"
bright_magenta = "#ff8ae2"

# Dual-accent wiring picked up by Omarchy's templates.
# Active window borders run signal -> depth, the one place both accents meet.
hyprland_active_border   = "#ff4fd1 #45e5ff 45deg"
hyprland_inactive_border = "rgba(221f4eaa)"

selection_foreground = "#fbf0fb"
selection_background = "#2a2d63"
